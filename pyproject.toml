[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-reservations"
version = "0.1.0"
description = "PostgreSQL-backed, concurrency-safe ticket reservations"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["ticketing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ticketing = ["migrations/*.sql"]
